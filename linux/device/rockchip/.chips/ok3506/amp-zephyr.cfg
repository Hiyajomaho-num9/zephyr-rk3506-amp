# RK3506 Zephyr AMP integration.
#
# This file is installed into the Rockchip Linux SDK by:
#   linux/scripts/install-to-sdk.sh <SDK_ROOT>
#
# @RK3506_AMP_REPO@ is replaced by the installer with the absolute path of the
# zephyr-rk3506-amp repository. Override RK3506_AMP_REPO manually only if the
# repository is moved after installation.

RK3506_AMP_REPO="${RK3506_AMP_REPO:-@RK3506_AMP_REPO@}"

RK_AMP_ZEPHYR_DIR="${RK_AMP_ZEPHYR_DIR:-$RK3506_AMP_REPO/zephyr}"
RK_AMP_ZEPHYR_APP="${RK_AMP_ZEPHYR_APP:-$RK_AMP_ZEPHYR_DIR/samples/subsys/ipc/rpmsg/rk3506_pingpong}"
RK_AMP_ZEPHYR_BOARD="${RK_AMP_ZEPHYR_BOARD:-ok3506b_s12_amp_uart1}"
RK_AMP_ZEPHYR_BUILD_DIR="${RK_AMP_ZEPHYR_BUILD_DIR:-$RK_OUTDIR/zephyr-build/amp2}"
RK_AMP_ZEPHYR_PREBUILT_BIN="${RK_AMP_ZEPHYR_PREBUILT_BIN:-$RK_SDK_DIR/output/zephyr-rk3506/zephyr.bin}"

# The repository carries the two modules needed by the validated RK3506 build,
# so a fresh user does not need an external Zephyr workspace just to build AMP.
export ZEPHYR_MODULES="${ZEPHYR_MODULES:-$RK_AMP_ZEPHYR_DIR/external_modules/hal/cmsis;$RK_AMP_ZEPHYR_DIR/external_modules/lib/picolibc}"
