# Debug overlay conf: GPIO driver + shell (2026-09-03)
# Usage: RK_AMP_ZEPHYR_CONF=<this file> ./build.sh amp
# Base prj.conf stays production-clean; this enables the RK3506 GPIO
# driver on all banks + interactive gpio/devmem shell for on-board triage.
CONFIG_GPIO=y
CONFIG_GPIO_RK3506=y
CONFIG_GPIO_SHELL=y
CONFIG_GPIO_SHELL_INFO_CMD=y
CONFIG_GPIO_SHELL_TOGGLE_CMD=y
CONFIG_GPIO_SHELL_BLINK_CMD=y
