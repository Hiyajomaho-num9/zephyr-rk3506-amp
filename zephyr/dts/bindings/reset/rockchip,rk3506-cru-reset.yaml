description: Rockchip RK3506 CRU reset controller

compatible: "rockchip,rk3506-cru-reset"

include: [base.yaml, reset-controller.yaml]

properties:
  cru:
    type: phandle
    required: true
    description: RK3506 CRU MMIO provider node.

  "#reset-cells":
    const: 1

reset-cells:
  - id
