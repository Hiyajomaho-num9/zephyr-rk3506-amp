# SPDX-License-Identifier: Apache-2.0

description: Rockchip RK3506 CRU clock controller

compatible: "rockchip,rk3506-cru-clock"

include: [base.yaml, clock-controller.yaml]

properties:
  reg:
    required: true
    description: Main CRU and PMU CRU register ranges, in that order.

  reg-names:
    required: true
    description: Must contain "cru" and "pmu".

  "#clock-cells":
    const: 1

clock-cells:
  - id
