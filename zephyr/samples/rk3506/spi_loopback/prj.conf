# SPDX-License-Identifier: Apache-2.0

CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG=y
# Print in the caller: if CPU2 stalls on a gated clock, the last line is out.
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_IMMEDIATE_CLEAN_OUTPUT=y
# The default 32-bit cycle timestamp wraps every 179 s at 24 MHz.
CONFIG_LOG_TIMESTAMP_64BIT=y

CONFIG_SPI=y

# This application does not create an RPMsg endpoint.
CONFIG_SOC_RK3506_RPMSG_LITE=n
