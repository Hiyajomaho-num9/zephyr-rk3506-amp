sample:
  name: RK3506 GPIO0_A2 one-shot key signal
  description: >
    Uses the Zephyr GPIO driver to drive GPIO0_A2:
    HIGH for 50 s -> LOW for 250 ms -> HIGH for 20 s -> LOW for 250 ms -> HIGH indefinitely,
    once per application boot.
tests:
  sample.rk3506.gpio_power_cycle:
    build_only: true
    platform_allow:
      - ok3506b_s12_amp_uart1
    integration_platforms:
      - ok3506b_s12_amp_uart1
