# SPDX-License-Identifier: Apache-2.0

CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y

CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_BACKEND_SERIAL_INTERRUPT_DRIVEN=n
CONFIG_SHELL_BACKEND_SERIAL_API_POLLING=y
CONFIG_SHELL_BACKEND_SERIAL_RX_POLL_PERIOD=10
CONFIG_SHELL_PROMPT_UART="rk3506:~$ "
CONFIG_SHELL_STACK_SIZE=4096
CONFIG_KERNEL_SHELL=y
CONFIG_DEVICE_SHELL=y
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_NAME=y

CONFIG_ARMV7_EXCEPTION_STACK_SIZE=8192
CONFIG_ARMV7_FIQ_STACK_SIZE=8192
CONFIG_ARMV7_SVC_STACK_SIZE=8192
CONFIG_ARMV7_SYS_STACK_SIZE=8192
CONFIG_IDLE_STACK_SIZE=8192
CONFIG_ISR_STACK_SIZE=8192
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192

CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_COMMON_LIBC_MALLOC=y
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=32768

# Phase 4.7 BSP baseline:
# mailbox2 IRQ176, GIC target 0x4, Group0. Keep the polling fallback in this
# sample so RPMsg command tests do not depend on the mailbox IRQ path alone.
# CONFIG_SOC_RK3506_RPMSG_MBOX_GIC_GROUP1 is not set
# CONFIG_SOC_RK3506_RPMSG_IRQ_ONLY_AFTER_NS is not set
# CONFIG_SOC_RK3506_RPMSG_KEEP_IRQ_ENABLE is not set
CONFIG_SOC_RK3506_PRIVATE_ICACHE=y
CONFIG_SOC_RK3506_PRIVATE_DCACHE=y

# Phase 6.1 production default:
# keep verified RPMsg/cache policy, but disable validation-only diagnostics.
CONFIG_SOC_RK3506_BOOT_BANNER=y
# CONFIG_SOC_RK3506_RPMSG_DEBUG_LOG is not set

# Phase 7.6 CAN driver path:
# Enable the RK3506 CAN driver.  CAN traffic is controlled by RPMsg commands
# from Linux, not by fixed sample Kconfig knobs.
CONFIG_CAN=y
CONFIG_CAN_RK3506=y
