# RK3506 Linux + Zephyr AMP. All project sources live in this SDK.
# This is the single source of Zephyr build paths. The ITS describes the image.

RK_AMP_ZEPHYR_DIR="$RK_SDK_DIR/zephyr"
RK_AMP_ZEPHYR_APP="${RK_AMP_ZEPHYR_APP:-$RK_AMP_ZEPHYR_DIR/samples/subsys/ipc/rpmsg/rk3506_pingpong}"
RK_AMP_ZEPHYR_BOARD="${RK_AMP_ZEPHYR_BOARD:-ok3506b_s12_amp_uart1}"
RK_AMP_ZEPHYR_BOARD_ROOT="$RK_AMP_ZEPHYR_DIR"
RK_AMP_ZEPHYR_SOC_ROOT="$RK_AMP_ZEPHYR_DIR"
RK_AMP_ZEPHYR_DTS_ROOT="$RK_AMP_ZEPHYR_DIR"
RK_AMP_ZEPHYR_BUILD_DIR="${RK_AMP_ZEPHYR_BUILD_DIR:-$RK_OUTDIR/zephyr/${RK_AMP_ZEPHYR_APP##*/}}"

# Select bundled modules explicitly instead of an external west workspace.
RK_AMP_ZEPHYR_MODULES="$RK_AMP_ZEPHYR_DIR/external_modules/hal/cmsis;$RK_AMP_ZEPHYR_DIR/external_modules/lib/picolibc"

# Always build sources. The former cache could select the wrong app or miss
# driver changes. All new outputs belong under output/.
RK_AMP_ZEPHYR_PREBUILT_BIN=""
RK_AMP_ZEPHYR_EXTRA_MODULES=""
